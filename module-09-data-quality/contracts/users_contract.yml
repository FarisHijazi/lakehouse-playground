name: users
version: "1.0"
owner: identity-team@podcast.com
description: >
  User profile data. Each record represents a registered user of the podcast
  platform. Stored as a single CSV file with all users.

schema:
  - name: user_id
    type: string
    nullable: false
    unique: true
    description: Unique identifier for the user (format usr_NNNNNN)

  - name: name
    type: string
    nullable: false
    unique: false
    description: Display name of the user

  - name: email
    type: string
    nullable: false
    unique: true
    description: Email address of the user

  - name: country
    type: string
    nullable: false
    unique: false
    description: Two-letter country code

  - name: city
    type: string
    nullable: true
    unique: false
    description: City of residence (optional)

  - name: platform
    type: string
    nullable: false
    unique: false
    description: Primary platform used for signup

  - name: signup_date
    type: string
    nullable: false
    unique: false
    description: Date when the user signed up (expected format YYYY-MM-DD)

  - name: subscription_type
    type: string
    nullable: false
    unique: false
    description: Current subscription tier

  - name: age
    type: integer
    nullable: true
    unique: false
    description: Age of the user in years

  - name: gender
    type: string
    nullable: true
    unique: false
    description: Gender of the user

quality_rules:
  - column: user_id
    rule: pattern
    pattern: "^usr_\\d{6}$"
    severity: critical

  - column: email
    rule: pattern
    pattern: ".+@.+\\..+"
    severity: warning

  - column: age
    rule: range
    min: 13
    max: 120
    severity: warning

  - column: subscription_type
    rule: accepted_values
    values: ["free", "premium", "premium_annual", "trial"]
    severity: critical

  - column: platform
    rule: accepted_values
    values: ["ios", "android", "web", "car_play", "smart_speaker"]
    severity: warning

  - column: gender
    rule: accepted_values
    values: ["m", "f", "M", "F", "male", "female", "Male", "Female"]
    severity: info
    note: "Inconsistent values are a known issue; normalization needed"

  - column: signup_date
    rule: pattern
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    severity: warning
    note: "Multiple date formats exist; should be normalized to YYYY-MM-DD"

freshness:
  max_delay_hours: 168
  timestamp_column: signup_date

volume:
  min_rows: 4000
  max_rows: 10000

sla:
  availability: "Weekly sync"
  description: "User data is synced weekly from the identity service"
