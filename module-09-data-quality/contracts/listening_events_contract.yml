name: listening_events
version: "1.0"
owner: platform-team@podcast.com
description: >
  User listening activity events. Each record represents a single user
  interaction with a podcast episode (play, pause, seek, complete, skip).
  Partitioned daily as JSONL files.

schema:
  - name: event_id
    type: string
    nullable: false
    unique: true
    description: Unique identifier for the listening event

  - name: user_id
    type: string
    nullable: false
    unique: false
    description: Reference to the user who triggered the event

  - name: episode_id
    type: string
    nullable: false
    unique: false
    description: Reference to the episode being listened to

  - name: event_type
    type: string
    nullable: false
    unique: false
    description: Type of listening event

  - name: timestamp
    type: string
    nullable: false
    unique: false
    description: ISO 8601 timestamp of when the event occurred

  - name: listened_seconds
    type: integer
    nullable: false
    unique: false
    description: Number of seconds the user listened during this event

  - name: platform
    type: string
    nullable: false
    unique: false
    description: Client platform (ios, android, web, car_play, smart_speaker)

  - name: country
    type: string
    nullable: false
    unique: false
    description: Two-letter country code of the user

  - name: app_version
    type: string
    nullable: true
    unique: false
    description: Version of the client application

quality_rules:
  - column: event_type
    rule: accepted_values
    values: ["play", "pause", "seek", "complete", "skip"]
    severity: critical

  - column: listened_seconds
    rule: range
    min: 0
    max: 36000
    severity: critical

  - column: platform
    rule: accepted_values
    values: ["ios", "android", "web", "car_play", "smart_speaker"]
    severity: warning

  - column: country
    rule: pattern
    pattern: "^[A-Z]{2}$"
    severity: warning

freshness:
  max_delay_hours: 24
  timestamp_column: timestamp

volume:
  min_daily_rows: 10
  max_daily_rows: 1000

sla:
  availability: "06:00 UTC daily"
  description: "Listening events for the previous day must be available by 6 AM UTC"
