name: taxi_zone_lookup
owner: taxi-data-team@nyctlc.gov
description: NYC TLC taxi zone reference data mapping LocationID to Borough and Zone
version: "1.0"

schema:
  - name: LocationID
    type: integer
    nullable: false
    unique: true
  - name: Borough
    type: string
    nullable: false
  - name: Zone
    type: string
    nullable: false
  - name: service_zone
    type: string
    nullable: false

quality_rules:
  - column: LocationID
    rule: range
    min: 1
    max: 265
    severity: error
  - column: Borough
    rule: accepted_values
    values: ["Manhattan", "Bronx", "Brooklyn", "Queens", "Staten Island", "EWR", "Unknown"]
    severity: warning

volume:
  min_rows: 200
  max_rows: 300
