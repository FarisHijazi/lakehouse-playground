# =============================================================================
# NYC Taxi Analytics -- Metrics Definitions (Semantic / Metrics Layer)
# =============================================================================
# This file is the single source of truth for every business metric used in
# dashboards, reports, and alerting.  Each entry follows a consistent schema:
#
#   name            - snake_case identifier (unique)
#   display_name    - human-friendly label shown in dashboards
#   description     - what the metric measures and any nuances
#   domain          - business area (volume, revenue, trip_characteristics, geographic, payment)
#   type            - calculation type (count, sum, average, ratio, percentile)
#   expression      - pseudo-SQL expression used to compute the metric
#   source          - primary data source table / file
#   dimensions      - columns the metric can be sliced by
#   time_grains     - supported time aggregations
#   owner           - team responsible for this metric
#   thresholds      - warning and critical bounds for alerting
#   tags            - free-form labels for filtering and discovery
# =============================================================================

metrics:

  # ---------------------------------------------------------------------------
  # Trip Volume
  # ---------------------------------------------------------------------------
  - name: daily_trips
    display_name: "Daily Trips"
    description: >
      Total number of taxi trips completed on a given calendar day.
    domain: volume
    type: count
    expression: "COUNT(*) -- per day"
    source: yellow_tripdata
    dimensions: [borough, vendor, payment_type]
    time_grains: [day]
    owner: analytics-team
    thresholds:
      warning_below: 5000
      critical_below: 1000
    tags: [executive, volume]

  - name: trips_per_hour
    display_name: "Avg Trips per Hour"
    description: >
      Average number of trips per hour across the dataset, measuring
      overall fleet utilization.
    domain: volume
    type: average
    expression: "COUNT(*) / COUNT(DISTINCT hour) -- per day"
    source: yellow_tripdata
    dimensions: [borough, vendor]
    time_grains: [day, week]
    owner: analytics-team
    thresholds:
      warning_below: 200
      critical_below: 50
    tags: [volume, operations]

  - name: avg_passenger_count
    display_name: "Avg Passengers per Trip"
    description: >
      Mean passenger_count across all trips. Indicates vehicle occupancy.
    domain: volume
    type: average
    expression: "AVG(passenger_count)"
    source: yellow_tripdata
    dimensions: [borough, vendor]
    time_grains: [day, week, month]
    owner: analytics-team
    thresholds:
      warning_below: 1.0
      critical_below: 0.5
    tags: [volume]

  # ---------------------------------------------------------------------------
  # Revenue & Fares
  # ---------------------------------------------------------------------------
  - name: total_revenue
    display_name: "Total Revenue ($)"
    description: >
      Sum of total_amount across all trips, representing gross revenue
      including fare, tips, tolls, and surcharges.
    domain: revenue
    type: sum
    expression: "SUM(total_amount)"
    source: yellow_tripdata
    dimensions: [borough, vendor, payment_type]
    time_grains: [day, week, month]
    owner: analytics-team
    thresholds:
      warning_below: 50000
      critical_below: 10000
    tags: [revenue, executive]

  - name: avg_fare_amount
    display_name: "Average Fare ($)"
    description: >
      Mean fare_amount across all trips with positive fare.
    domain: revenue
    type: average
    expression: "AVG(fare_amount) WHERE fare_amount > 0"
    source: yellow_tripdata
    dimensions: [borough, vendor, payment_type]
    time_grains: [day, week, month]
    owner: analytics-team
    thresholds:
      warning_below: 8.0
      critical_below: 5.0
    tags: [revenue, executive]

  - name: avg_tip_percentage
    display_name: "Avg Tip Percentage"
    description: >
      Mean tip as a fraction of fare, computed only for trips where
      fare_amount > 0 (tip_amount / fare_amount).
    domain: revenue
    type: ratio
    expression: "AVG(tip_amount / NULLIF(fare_amount, 0)) WHERE fare_amount > 0"
    source: yellow_tripdata
    dimensions: [borough, payment_type]
    time_grains: [day, week, month]
    owner: analytics-team
    thresholds:
      warning_below: 0.10
      critical_below: 0.05
    tags: [revenue]

  - name: revenue_per_mile
    display_name: "Revenue per Mile ($)"
    description: >
      Total revenue divided by total trip miles, measuring fare efficiency.
    domain: revenue
    type: ratio
    expression: "SUM(total_amount) / NULLIF(SUM(trip_distance), 0)"
    source: yellow_tripdata
    dimensions: [borough, vendor]
    time_grains: [day, week, month]
    owner: analytics-team
    thresholds:
      warning_below: 3.0
      critical_below: 2.0
    tags: [revenue, operations]

  # ---------------------------------------------------------------------------
  # Trip Characteristics
  # ---------------------------------------------------------------------------
  - name: avg_trip_distance
    display_name: "Avg Trip Distance (miles)"
    description: >
      Mean trip_distance in miles across all trips.
    domain: trip_characteristics
    type: average
    expression: "AVG(trip_distance)"
    source: yellow_tripdata
    dimensions: [borough, vendor, payment_type]
    time_grains: [day, week, month]
    owner: analytics-team
    thresholds:
      warning_below: 1.0
      critical_below: 0.5
    tags: [trip_characteristics, executive]

  - name: avg_trip_duration_minutes
    display_name: "Avg Trip Duration (min)"
    description: >
      Mean trip duration in minutes, computed as the difference between
      dropoff and pickup timestamps.
    domain: trip_characteristics
    type: average
    expression: "AVG(DATEDIFF('minute', tpep_pickup_datetime, tpep_dropoff_datetime))"
    source: yellow_tripdata
    dimensions: [borough, vendor]
    time_grains: [day, week, month]
    owner: analytics-team
    thresholds:
      warning_above: 60
      critical_above: 120
    tags: [trip_characteristics]

  - name: p95_trip_duration_minutes
    display_name: "P95 Trip Duration (min)"
    description: >
      95th percentile trip duration in minutes. Useful for identifying
      unusually long trips.
    domain: trip_characteristics
    type: percentile
    expression: "PERCENTILE_CONT(0.95) WITHIN GROUP (ORDER BY duration_minutes)"
    source: yellow_tripdata
    dimensions: [borough]
    time_grains: [day, week]
    owner: analytics-team
    thresholds:
      warning_above: 60
      critical_above: 90
    tags: [trip_characteristics, operations]

  - name: short_trip_rate
    display_name: "Short Trip Rate (< 1 mile)"
    description: >
      Fraction of trips with trip_distance under 1 mile.
    domain: trip_characteristics
    type: ratio
    expression: "COUNT(*) FILTER (WHERE trip_distance < 1) / NULLIF(COUNT(*), 0)"
    source: yellow_tripdata
    dimensions: [borough]
    time_grains: [day, week, month]
    owner: analytics-team
    thresholds: {}
    tags: [trip_characteristics]

  # ---------------------------------------------------------------------------
  # Geographic
  # ---------------------------------------------------------------------------
  - name: trips_by_borough
    display_name: "Trips by Pickup Borough"
    description: >
      Trip count broken down by pickup borough, derived by joining
      PULocationID to the taxi zone lookup.
    domain: geographic
    type: count
    expression: "COUNT(*) GROUP BY borough"
    source: yellow_tripdata
    dimensions: [vendor, payment_type]
    time_grains: [day, week, month]
    owner: analytics-team
    thresholds: {}
    tags: [geographic, executive]

  - name: top_pickup_zones
    display_name: "Top Pickup Zones"
    description: >
      Zones ranked by total number of pickups.
    domain: geographic
    type: count
    expression: "COUNT(*) GROUP BY PULocationID ORDER BY COUNT(*) DESC"
    source: yellow_tripdata
    dimensions: [borough]
    time_grains: [day, week, month]
    owner: analytics-team
    thresholds: {}
    tags: [geographic]

  - name: cross_borough_rate
    display_name: "Cross-Borough Trip Rate"
    description: >
      Fraction of trips where the pickup borough differs from the dropoff
      borough, indicating inter-borough mobility.
    domain: geographic
    type: ratio
    expression: >
      COUNT(*) FILTER (WHERE pu_borough != do_borough) /
      NULLIF(COUNT(*), 0)
    source: yellow_tripdata
    dimensions: []
    time_grains: [day, week, month]
    owner: analytics-team
    thresholds: {}
    tags: [geographic]

  # ---------------------------------------------------------------------------
  # Payment
  # ---------------------------------------------------------------------------
  - name: credit_card_rate
    display_name: "Credit Card Payment Rate"
    description: >
      Fraction of trips paid by credit card (payment_type = 1).
    domain: payment
    type: ratio
    expression: "COUNT(*) FILTER (WHERE payment_type = 1) / NULLIF(COUNT(*), 0)"
    source: yellow_tripdata
    dimensions: [borough, vendor]
    time_grains: [day, week, month]
    owner: analytics-team
    thresholds: {}
    tags: [payment]

  - name: avg_tip_credit_card
    display_name: "Avg Tip (Credit Card)"
    description: >
      Average tip amount for credit card trips only, since cash tips
      are not recorded in the data.
    domain: payment
    type: average
    expression: "AVG(tip_amount) WHERE payment_type = 1"
    source: yellow_tripdata
    dimensions: [borough, vendor]
    time_grains: [day, week, month]
    owner: analytics-team
    thresholds:
      warning_below: 1.50
      critical_below: 0.50
    tags: [payment, revenue]
