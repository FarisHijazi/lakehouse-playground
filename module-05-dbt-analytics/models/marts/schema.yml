version: 2

models:
  - name: mart_daily_metrics
    description: >
      Daily trip and revenue metrics aggregated across all taxi types.
      Used for time-series dashboards and trend analysis.
    columns:
      - name: trip_date
        description: "Calendar date"
        tests:
          - unique
          - not_null
      - name: total_trips
        description: "Total number of trips on this date"
      - name: total_revenue
        description: "Total fare revenue across all trips"
      - name: avg_distance_miles
        description: "Average trip distance in miles"
      - name: avg_tip_pct
        description: "Average tip as percentage of fare"
      - name: avg_revenue_per_trip
        description: "Average revenue per trip"
      - name: yellow_trips
        description: "Number of yellow taxi trips"
      - name: green_trips
        description: "Number of green taxi trips"

  - name: mart_zone_performance
    description: >
      Zone-level performance metrics. One row per pickup zone. Answers
      which zones generate the most trips, revenue, and tips.
    columns:
      - name: location_id
        description: "TLC zone identifier"
        tests:
          - unique
          - not_null
      - name: zone_name
        description: "Zone name (neighborhood or landmark)"
      - name: borough
        description: "NYC borough"
      - name: total_trips
        description: "Lifetime total trips originating from this zone"
      - name: total_revenue
        description: "Lifetime total revenue from this zone"
      - name: avg_daily_trips
        description: "Average trips per active day"
      - name: trip_volume_rank
        description: "Rank by total trip volume (1 = busiest)"

  - name: mart_hourly_patterns
    description: >
      Hour-of-day and day-of-week trip patterns. Shows how trip volume,
      fares, tips, and speed vary by time of day and weekday vs weekend.
    columns:
      - name: pickup_hour
        description: "Hour of day (0-23)"
        tests:
          - not_null
      - name: pickup_dow
        description: "Day of week (0=Sunday, 6=Saturday)"
        tests:
          - not_null
      - name: day_type
        description: "Weekday or weekend"
        tests:
          - accepted_values:
              values: ['weekday', 'weekend']
      - name: trip_count
        description: "Number of trips in this hour/dow combination"
      - name: avg_speed_mph
        description: "Average speed -- shows congestion patterns"
      - name: avg_tip_pct
        description: "Average tip percentage"

  - name: mart_weather_impact
    description: >
      Daily trip metrics joined with weather observations. Enables analysis
      of how temperature, rain, and snow affect taxi ridership and revenue.
    columns:
      - name: trip_date
        description: "Calendar date"
        tests:
          - unique
          - not_null
      - name: weather_category
        description: "Classified weather condition for the day"
        tests:
          - accepted_values:
              values: ['clear', 'light_rain', 'heavy_rain', 'snow', 'extreme_heat', 'extreme_cold']
      - name: temp_avg_f
        description: "Average temperature in Fahrenheit"
      - name: precipitation_in
        description: "Precipitation in inches"
      - name: total_trips
        description: "Total trips on this date"
      - name: total_revenue
        description: "Total revenue on this date"
