version: 2

sources:
  - name: raw
    description: "Raw NYC TLC taxi trip data and reference tables"
    meta:
      data_path: "../data/raw"
    tables:
      - name: yellow_tripdata
        description: "Yellow taxi trip records. Parquet files partitioned by month."
        meta:
          file_path: "../data/bronze/yellow_tripdata_*.parquet"
          file_format: parquet
      - name: green_tripdata
        description: "Green taxi trip records. Serve outer boroughs."
        meta:
          file_path: "../data/bronze/green_tripdata_*.parquet"
          file_format: parquet
      - name: fhvhv_tripdata
        description: "For-hire vehicle high-volume trip records (Uber, Lyft)."
        meta:
          file_path: "../data/bronze/fhvhv_tripdata_*.parquet"
          file_format: parquet
      - name: taxi_zone_lookup
        description: "Lookup table mapping 265 location IDs to zone names and boroughs."
        meta:
          file_path: "../data/raw/taxi_zone_lookup.csv"
          file_format: csv
      - name: nyc_weather
        description: "Daily weather observations from Central Park station (NOAA)."
        meta:
          file_path: "../data/raw/nyc_weather_2023.csv"
          file_format: csv

models:
  - name: stg_yellow_trips
    description: >
      Cleaned yellow taxi trip records. Renames columns to snake_case,
      casts types, and filters out rows with null pickup timestamps.
    columns:
      - name: trip_id
        description: "Surrogate row identifier"
        tests:
          - unique
          - not_null
      - name: taxi_type
        description: "Always 'yellow' for this model"
        tests:
          - accepted_values:
              values: ['yellow']
      - name: vendor_id
        description: "Technology provider ID (1=CMT, 2=VeriFone)"
        tests:
          - not_null
          - accepted_values:
              values: [1, 2]
      - name: pickup_datetime
        description: "Trip pickup timestamp"
        tests:
          - not_null
      - name: dropoff_datetime
        description: "Trip dropoff timestamp"
      - name: passenger_count
        description: "Number of passengers (driver-entered)"
      - name: trip_distance
        description: "Trip distance in miles (from meter)"
      - name: rate_code_id
        description: "Rate code (1=Standard, 2=JFK, 3=Newark, etc.)"
      - name: pickup_location_id
        description: "TLC taxi zone ID for pickup"
        tests:
          - not_null
          - relationships:
              to: ref('stg_zones')
              field: location_id
              config:
                severity: warn
      - name: dropoff_location_id
        description: "TLC taxi zone ID for dropoff"
        tests:
          - relationships:
              to: ref('stg_zones')
              field: location_id
              config:
                severity: warn
      - name: payment_type_id
        description: "Payment method (1=Credit, 2=Cash, 3=No charge, 4=Dispute)"
      - name: fare_amount
        description: "Meter fare in dollars"
      - name: tip_amount
        description: "Tip amount in dollars (credit card tips only)"
      - name: total_amount
        description: "Total charged to passenger"

  - name: stg_green_trips
    description: >
      Cleaned green taxi trip records. Green taxis operate outside
      Manhattan core. Similar schema to yellow with slight differences.
    columns:
      - name: trip_id
        description: "Surrogate row identifier"
        tests:
          - unique
          - not_null
      - name: taxi_type
        description: "Always 'green' for this model"
        tests:
          - accepted_values:
              values: ['green']
      - name: vendor_id
        description: "Technology provider ID"
        tests:
          - not_null
      - name: pickup_datetime
        description: "Trip pickup timestamp"
        tests:
          - not_null
      - name: pickup_location_id
        description: "TLC taxi zone ID for pickup"
        tests:
          - not_null
          - relationships:
              to: ref('stg_zones')
              field: location_id
              config:
                severity: warn
      - name: dropoff_location_id
        description: "TLC taxi zone ID for dropoff"
        tests:
          - relationships:
              to: ref('stg_zones')
              field: location_id
              config:
                severity: warn
      - name: fare_amount
        description: "Meter fare in dollars"
      - name: total_amount
        description: "Total charged to passenger"

  - name: stg_fhv_trips
    description: >
      Cleaned for-hire vehicle (Uber/Lyft) trip records. Schema differs
      from yellow/green -- uses license numbers instead of vendor IDs,
      and has different fare breakdown columns.
    columns:
      - name: trip_id
        description: "Surrogate row identifier"
        tests:
          - unique
          - not_null
      - name: taxi_type
        description: "Always 'fhv' for this model"
        tests:
          - accepted_values:
              values: ['fhv']
      - name: hvfhs_license_num
        description: "HVFHS license number (HV0003=Uber, HV0005=Lyft, etc.)"
        tests:
          - not_null
          - accepted_values:
              values: ['HV0002', 'HV0003', 'HV0004', 'HV0005']
      - name: pickup_datetime
        description: "Trip pickup timestamp"
        tests:
          - not_null
      - name: pickup_location_id
        description: "TLC taxi zone ID for pickup"
        tests:
          - not_null
          - relationships:
              to: ref('stg_zones')
              field: location_id
              config:
                severity: warn
      - name: dropoff_location_id
        description: "TLC taxi zone ID for dropoff"
        tests:
          - relationships:
              to: ref('stg_zones')
              field: location_id
              config:
                severity: warn
      - name: trip_distance
        description: "Trip distance in miles"
      - name: base_passenger_fare
        description: "Base fare charged to passenger"
      - name: tip_amount
        description: "Tip amount in dollars"

  - name: stg_zones
    description: >
      NYC TLC taxi zone reference data. 265 zones across the 5 boroughs
      plus EWR (Newark Airport) and Unknown.
    columns:
      - name: location_id
        description: "Unique zone identifier (1-265)"
        tests:
          - unique
          - not_null
      - name: borough
        description: "NYC borough name"
        tests:
          - not_null
          - accepted_values:
              values: ['Manhattan', 'Brooklyn', 'Queens', 'Bronx', 'Staten Island', 'EWR', 'Unknown']
      - name: zone_name
        description: "Zone name (neighborhood or landmark)"
        tests:
          - not_null
      - name: service_zone
        description: "Service zone classification"

  - name: stg_weather
    description: >
      Daily weather observations for NYC from Central Park NOAA station.
      Includes temperature, precipitation, snowfall, and wind speed.
    columns:
      - name: weather_date
        description: "Observation date"
        tests:
          - unique
          - not_null
      - name: temp_max_f
        description: "Daily maximum temperature in Fahrenheit"
      - name: temp_min_f
        description: "Daily minimum temperature in Fahrenheit"
      - name: temp_avg_f
        description: "Daily average temperature in Fahrenheit"
      - name: precipitation_in
        description: "Precipitation in inches"
      - name: snowfall_in
        description: "Snowfall in inches"
      - name: snow_depth_in
        description: "Snow depth on ground in inches"
      - name: wind_speed_mph
        description: "Average wind speed in MPH"
