version: 2

models:
  - name: int_trips_enriched
    description: >
      Yellow and green taxi trips enriched with pickup/dropoff zone names,
      borough info, and derived metrics (trip duration, speed, tip percentage,
      airport flag). This is the core fact model that mart models build on.
    columns:
      - name: trip_key
        description: "Unique key across yellow and green trips (taxi_type-trip_id)"
        tests:
          - unique
          - not_null
      - name: taxi_type
        description: "Taxi type: yellow or green"
        tests:
          - accepted_values:
              values: ['yellow', 'green']
      - name: trip_date
        description: "Date of the trip (from pickup datetime)"
      - name: pickup_hour
        description: "Hour of day for pickup (0-23)"
      - name: trip_duration_minutes
        description: "Trip duration in minutes (dropoff - pickup)"
      - name: speed_mph
        description: "Average speed in MPH (distance / duration)"
      - name: tip_pct
        description: "Tip as percentage of fare amount"
      - name: is_airport_trip
        description: "True if pickup or dropoff is JFK, LaGuardia, or Newark"

  - name: int_daily_trip_summary
    description: >
      Daily trip aggregation by pickup zone and taxi type. Includes counts,
      distances, durations, revenue, and airport trip counts. Used by mart
      models for zone and daily metrics.
    columns:
      - name: trip_date
        description: "Calendar date"
        tests:
          - not_null
      - name: pickup_location_id
        description: "TLC zone ID for pickup location"
        tests:
          - not_null
      - name: taxi_type
        description: "Taxi type: yellow or green"
      - name: trip_count
        description: "Number of trips"
      - name: total_revenue
        description: "Sum of total_amount for all trips"
      - name: avg_speed_mph
        description: "Average speed across trips in MPH"
